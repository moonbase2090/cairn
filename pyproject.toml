[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn"
version = "0.15.6"
description = "Local-first shared memory for CLI agents — six verbs, keyless, git-syncable"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Moonbase 2090 LLC" }]
keywords = ["memory", "agents", "vector-search", "cli", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
urls = { Homepage = "https://github.com/moonbase2090/cairn" }
dependencies = [
    "numpy>=1.26",
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
embed = ["fastembed>=0.3"]
backup = ["boto3>=1.34"]
aws = ["boto3>=1.40", "botocore>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "boto3>=1.40", "botocore>=1.40", "ruff==0.17.1"]
postgres = ["pgvector>=0.3", "psycopg[binary]>=3.2"]

[project.scripts]
cairn = "cairn.cli:main"
cairn-mcp = "cairn.mcp_server:main"
cairn-embedd = "cairn.embedd:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cairn = ["agent_skill.md", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
required-version = "==0.17.1"
target-version = "py311"
line-length = 88
