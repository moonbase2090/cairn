name: scorecard

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sc v0.1.1
        run: |
          set -eu
          asset=sc-v0.1.1-x86_64-unknown-linux-gnu.tar.gz
          base=https://github.com/moonbase2090/Scorecard/releases/download/v0.1.1
          curl -fsSL -O "$base/$asset"
          curl -fsSL -O "$base/SHA256SUMS"
          sha256sum -c --ignore-missing SHA256SUMS
          tar -xzf "$asset"
          mkdir -p "$HOME/.local/bin"
          install -m 755 sc sc-mcp "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Analyze
        run: sc analyze . --format all --out scorecard.html --fail-on ""
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-report
          if-no-files-found: error
          path: |
            scorecard.html
            scorecard.md
            scorecard.json
            scorecard.sarif
      - name: Upload SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: scorecard.sarif
