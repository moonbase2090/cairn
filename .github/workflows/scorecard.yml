name: scorecard

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cairn_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cairn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CAIRN_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/cairn_test
      CAIRN_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
      CAIRN_TEST_MINIO_ACCESS_KEY: minioadmin
      CAIRN_TEST_MINIO_SECRET_KEY: minioadmin
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install project and dev dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[backup,dev,postgres]" uv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Litestream for backup integration tests
        run: |
          curl -fsSL https://github.com/benbjohnson/litestream/releases/download/v0.5.16/litestream-0.5.16-linux-x86_64.tar.gz -o "$RUNNER_TEMP/litestream.tar.gz"
          tar -xzf "$RUNNER_TEMP/litestream.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Start local MinIO for backup integration tests
        run: |
          docker run --detach --name cairn-test-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$CAIRN_TEST_MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$CAIRN_TEST_MINIO_SECRET_KEY" \
            sourcemation/minio:RELEASE.2025-10-15T17-29-55Z-20260905 server /data
      - name: Check MinIO is ready
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --output /dev/null http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          docker logs cairn-test-minio
          exit 1
      - name: Enable pgvector outside public
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["CAIRN_TEST_POSTGRES_URL"], autocommit=True) as conn:
              conn.execute("CREATE SCHEMA extensions")
              conn.execute("CREATE EXTENSION vector WITH SCHEMA extensions")
          PY
      - name: Install sc v0.1.4
        run: |
          set -eu
          asset=sc-v0.1.4-x86_64-unknown-linux-gnu.tar.gz
          base=https://github.com/moonbase2090/Scorecard/releases/download/v0.1.4
          curl -fsSL -O "$base/$asset"
          curl -fsSL -O "$base/SHA256SUMS"
          sha256sum -c --ignore-missing SHA256SUMS
          tar -xzf "$asset"
          mkdir -p "$HOME/.local/bin"
          install -m 755 sc sc-mcp "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Analyze
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$HOME/.local/bin:$PATH"
          uv --version
          pytest --version
          sc analyze . --format all --out scorecard.html --fail-on ""
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-report
          if-no-files-found: error
          path: |
            scorecard.html
            scorecard.md
            scorecard.json
            scorecard.sarif
      - name: Upload SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
