name: Release

on:
  push:
    # A hyphenated tag (v0.3.6-rc.1) publishes as a prerelease.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          if [ "${tag%%-*}" != "$version" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        run: uv run --no-project --python 3.12 python scripts/release/package.py --target ${{ matrix.target }} --out dist
        env:
          # Tag builds must ship signed and notarized macOS binaries.
          CAIRN_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          CAIRN_SIGNING_DIR: ${{ runner.temp }}/cairn-signing
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Remove signing keychain and keys
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/cairn-signing"
          security delete-keychain "$dir/cairn-signing.keychain-db" 2>/dev/null || true
          rm -rf "$dir"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cairn-${{ matrix.target }}
          path: dist/cairn-*
          if-no-files-found: error

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd dist
          rm -f SHA256SUMS
          sha256sum cairn-* | sort -k2 > SHA256SUMS
          set -- --repo "$GITHUB_REPOSITORY"
          prerelease=false
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=true ;;
          esac
          if gh release view "$GITHUB_REF_NAME" "$@" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" cairn-* SHA256SUMS "$@" --clobber
            if [ "$prerelease" = true ]; then
              gh release edit "$GITHUB_REF_NAME" "$@" --prerelease
            fi
          else
            flags="--verify-tag --title $GITHUB_REF_NAME --generate-notes"
            if [ "$prerelease" = true ]; then
              flags="$flags --prerelease"
            fi
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" "$@" $flags cairn-* SHA256SUMS
          fi
